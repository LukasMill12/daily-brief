name: Notify

# Sends a phone notification whenever a new brief lands, however it was written.
on:
  push:
    branches: [main]
    paths: [docs/brief.json]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Notify phone (needs NTFY_TOPIC secret)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "No NTFY_TOPIC set, skipping"; exit 0; fi
          TOP=$(python3 -c "import json; b=json.load(open('docs/brief.json')); print((b['world'] or b['lithuania'])[0]['headline'])")
          curl -s -H "Title: Your daily brief" -H "Click: $PAGE_URL" -d "$TOP" "https://ntfy.sh/$NTFY_TOPIC"
