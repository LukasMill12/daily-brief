<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Brief</title>
<style>
  :root {
    --bg: #faf9f7; --card: #ffffff; --text: #1c1b19; --muted: #77736c; --line: #e8e5df;
    --accent: #c2410c; --accent-soft: #fdf0e8; --link: #1c1b19;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --card: #1d1c1a; --text: #f1efea; --muted: #9b968d; --line: #2e2c29;
      --accent: #fb923c; --accent-soft: #2a1f17; --link: #f1efea;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { font-size: 30px; line-height: 1.15; margin: 0 0 4px; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .heads-up {
    margin: 20px 0 0; padding: 10px 14px; border-radius: 10px;
    background: var(--accent-soft); color: var(--text); font-size: 14px;
  }
  .heads-up p { margin: 2px 0; }
  section { margin-top: 36px; }
  h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); margin: 0 0 12px; font-weight: 600;
  }
  .item { padding: 14px 0; border-top: 1px solid var(--line); }
  .item:first-of-type { border-top: 0; padding-top: 0; }
  .item h3 { font-size: 17px; line-height: 1.3; margin: 0 0 4px; }
  .item p { margin: 0; }
  .star { color: var(--accent); margin-right: 4px; }
  .tag {
    display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--accent); margin-bottom: 2px;
  }
  .meta { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .meta a { color: var(--muted); }
  .ongoing .item h3 { font-size: 15px; }
  .quiet { font-size: 13px; color: var(--muted); margin-top: 10px; }
  footer { margin-top: 48px; font-size: 12px; color: var(--muted); }
  .error { color: var(--muted); }
</style>
</head>
<body>
<main id="app"><p class="error">Loading…</p></main>
<script>
const SECTIONS = [
  ["lithuania", "Lithuania"],
  ["world", "World"],
];

function esc(text) {
  const el = document.createElement("span");
  el.textContent = text ?? "";
  return el.innerHTML;
}

function sources(list) {
  return (list || []).map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join(" · ");
}

function story(s, showTag) {
  const tag = showTag && s.category !== "general" ? `<div class="tag">${esc(s.category)}</div>` : "";
  const star = s.highlight ? `<span class="star">★</span>` : "";
  return `<div class="item">${tag}<h3>${star}${esc(s.headline)}</h3><p>${esc(s.summary)}</p>
    <div class="meta">${esc(s.why)}${s.sources?.length ? " — " + sources(s.sources) : ""}</div></div>`;
}

function render(b) {
  const date = new Date(b.date + "T12:00:00").toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
  let html = `<header><h1>${esc(date)}</h1><p>${b.weather ? esc(b.weather.text) : "Your daily brief"}</p></header>`;
  if (b.heads_up?.length) html += `<div class="heads-up">${b.heads_up.map(h => `<p>⏰ ${esc(h)}</p>`).join("")}</div>`;

  for (const [key, title] of SECTIONS) {
    if (b[key]?.length) html += `<section><h2>${title}</h2>${b[key].map(s => story(s, false)).join("")}</section>`;
  }
  if (b.ongoing?.length || b.quiet_ongoing?.length) {
    html += `<section class="ongoing"><h2>Ongoing</h2>` + (b.ongoing || []).map(o =>
      `<div class="item"><h3>${esc(o.title)}</h3><p>${esc(o.update)}</p><div class="meta">${sources(o.sources)}</div></div>`).join("");
    if (b.quiet_ongoing?.length) html += `<p class="quiet">No major change: ${b.quiet_ongoing.map(esc).join(", ")}</p>`;
    html += `</section>`;
  }
  if (b.interesting?.length || b.events?.length) {
    html += `<section><h2>Interesting</h2>${(b.interesting || []).map(s => story(s, true)).join("")}` +
      (b.events || []).map(e =>
        `<div class="item"><div class="tag">${e.scope === "vilnius" ? "📍 Vilnius" : "🌍 Event"}</div><h3>${esc(e.title)}</h3>
         <p>${esc(e.when)}${e.where ? " · " + esc(e.where) : ""}</p><div class="meta">${sources(e.sources)}</div></div>`).join("") +
      `</section>`;
  }
  const problems = b.stats?.feed_problems || [];
  html += `<footer>Picked from ${b.stats?.items_read ?? "?"} headlines across ${b.stats?.feeds ?? "?"} sources.` +
    (problems.length ? `<br>⚠️ Not working today: ${problems.map(p => esc(p.split(":")[0])).join(", ")}` : "") + `</footer>`;
  document.getElementById("app").innerHTML = html;
}

fetch("brief.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(() => { document.getElementById("app").innerHTML = `<p class="error">No brief yet.</p>`; });
</script>
</body>
</html>
